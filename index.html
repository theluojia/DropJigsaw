<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0,touch-action:none">
<title>Drop Jigsaw</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
#gameArea{position:relative}
h1{color:#e0e0ff;font-size:20px;text-shadow:0 0 20px rgba(100,140,255,0.5);margin:0}
.title-row{display:flex;align-items:center;justify-content:center;width:100%;max-width:380px;position:relative}
#info{color:#8899cc;font-size:12px;display:flex;gap:14px}
#score{color:#e8d5a0;font-weight:bold}
canvas{border-radius:12px;box-shadow:0 0 30px rgba(60,100,200,0.3);cursor:grab}
canvas:active{cursor:grabbing}
#ctls{display:flex;flex-direction:column;align-items:center;gap:6px}
.hc{position:absolute;top:-8px;right:-8px;background:#ffd700;color:#1a1a2e;border-radius:50%;width:18px;height:18px;font-size:10px;line-height:18px;text-align:center;font-weight:bold}
button{padding:9px 14px;border:none;border-radius:23px;font-size:12px;font-weight:bold;cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent;outline:none;transition:background 0.3s}
#rb{background:linear-gradient(135deg,#4dd0e1,#00acc1)}
#rb:disabled{background:#444;color:#888}
#rb:disabled img{opacity:0.35}
.row2{display:flex;gap:8px;width:100%;justify-content:space-evenly}
.icon-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.icon-btn{width:54px;height:54px;border-radius:16px;padding:0;flex:none;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;color:#fff;position:relative;box-sizing:border-box}
.icon-btn img{width:28px;height:28px;object-fit:contain;image-rendering:auto}
.blabel{font-size:9px;line-height:1;font-weight:bold;text-align:center;white-space:nowrap;color:#aabbcc}
#db{background:linear-gradient(135deg,#444,#333)}
#db.on{background:linear-gradient(135deg,#7986cb,#5c6bc0);box-shadow:0 0 12px rgba(121,134,203,0.5)}
#db img{filter:brightness(0.7)}
#toast{position:absolute;background:rgba(0,0,0,0.65);color:#ffd700;padding:12px 18px;border-radius:16px;font-size:13px;font-weight:bold;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:20;text-align:center;word-break:break-word;white-space:normal;line-height:1.4}
#toast.show{opacity:1}
#status{display:none}
#logPanel{display:none;width:100%;max-width:360px;margin-top:6px}
#logPanel textarea{width:100%;height:160px;background:#0a0a1e;color:#aaccff;border:1px solid #334;border-radius:8px;padding:6px;font:10px monospace;resize:none}
#sb{background:linear-gradient(135deg,#ffab91,#ff7043)}
#sb.muted{background:linear-gradient(135deg,#4a4a3a,#333322)}
#lb{background:linear-gradient(135deg,#90a4ae,#607d8b)}

#scoreDisp{color:#ffd700;font-size:18px;font-weight:bold;position:absolute;left:10px;top:50%;transform:translateY(-50%);text-shadow:0 0 12px rgba(255,215,0,0.5);letter-spacing:1px;background:rgba(255,215,0,0.08);padding:2px 10px;border-radius:10px}
#restartBtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;cursor:pointer;opacity:0.75;image-rendering:auto}
#restartBtn:hover{opacity:1}

#confirmOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,8,0.75);z-index:300;justify-content:center;align-items:center;flex-direction:column}
#confirmDialog{background:#12122e;border:3px solid #445;border-radius:18px;padding:28px 36px;text-align:center;box-shadow:0 0 50px rgba(60,100,200,0.3),inset 0 0 30px rgba(40,60,140,0.08)}
#confirmDialog p{color:#c8d8ff;font-size:17px;margin:0 0 22px 0;font-weight:bold;letter-spacing:1px}
#confirmDialog button{padding:9px 22px;margin:0 10px;border:none;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer;color:#fff;letter-spacing:1px}
#confirmDialog .btn-yes{background:linear-gradient(135deg,#e74c3c,#c0392b)}
#confirmDialog .btn-no{background:linear-gradient(135deg,#4ecdc4,#44bd9e)}
#confirmDialog .btn-yes:hover{transform:scale(1.08)}
#confirmDialog .btn-no:hover{transform:scale(1.08)}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(255,200,0,0.3)}50%{box-shadow:0 0 38px rgba(255,200,0,0.6)}}
#endOverlay{display:none;position:absolute;z-index:15;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}
#endOverlay>*{pointer-events:auto}
#endText{color:#ffd700;font-size:28px;font-weight:bold;text-shadow:0 0 20px rgba(255,215,0,0.6);margin-bottom:18px;text-align:center}
#nb.endBtn{position:static;padding:12px 24px;font-size:15px;border:none;border-radius:26px;color:#fff;background:linear-gradient(135deg,#ffd700,#ff8c00);box-shadow:0 0 20px rgba(255,200,0,0.35);animation:pulse 1.8s ease-in-out infinite;white-space:nowrap}


#loader{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,30,0.95);z-index:200;flex-direction:column;justify-content:center;align-items:center;gap:20px}
#loader .bar-bg{width:70%;max-width:300px;height:10px;background:#333;border-radius:5px;overflow:hidden}
#loader .bar-fg{height:100%;background:linear-gradient(90deg,#6c5ce7,#00cec9);border-radius:5px;transition:width 0.3s}
#loader .prog-text{color:#ccc;font-size:14px}
#loader .btns{display:flex;gap:12px}
#loader .btns button{padding:10px 24px;border:none;border-radius:20px;font-size:14px;cursor:pointer;color:#fff}
#loader .btns .ld-reload{background:linear-gradient(135deg,#4ecdc4,#44bd9e)}
#loader .btns .ld-quit{background:linear-gradient(135deg,#ff6b6b,#ee5a24)}

</style>

<script>
"use strict";

// ==== i18n ====
var LANG=localStorage.getItem("lang")||"en";
var TBL={
  "Game {n}":{en:"Game {n}",zh:"第{n}局"},
 "Next Game":{en:"Next Game",zh:"下一局"},
 "Language":{en:"English",zh:"中文"},
 "Sound":{en:"Sound",zh:"音效"},
 "Hint":{en:"Hint",zh:"提示"},
 "Boom":{en:"Boom",zh:"消除"},
 "Magic Off":{en:"Magic Off",zh:"魔法关"},
 "Magic On":{en:"Magic On",zh:"魔法开"},
 "Sound On":{en:"Sound On",zh:"音效开"},
 "Sound Off":{en:"Sound Off",zh:"音效关"},
 "EN":{en:"EN",zh:"中文"},
 "Preparing puzzle...":{en:"Preparing puzzle...",zh:"准备拼图..."},
 "Loading puzzle...":{en:"Loading puzzle...",zh:"加载拼图..."},
 "Reload":{en:"Reload",zh:"重新加载"},
 "Quit":{en:"Quit",zh:"退出"},
 "Loading ":{en:"Loading ",zh:"加载 "},
 "Bonus":{en:"Bonus ",zh:"奖励局 "},"Congratulations":{en:"Congratulations",zh:"恭喜通关"},
 "Restart game?":{en:"Restart this game?",zh:"重新开始本局？"},
 "Yes":{en:"Yes",zh:"是"},
 "No":{en:"No",zh:"否"},
 "Continue?":{en:"Continue?",zh:"继续游戏？"},
 "New Game":{en:"New Game",zh:"重新开始"},
 "Score low!":{en:"Not enough score, need 50 pts",zh:"分数不足，需要 50 分"},
 "Board has space!":{en:"Board still has space, try filling it first",zh:"棋盘还有空位，先尝试填满棋盘"},
 "Board has groups!":{en:"Board has complete groups, try clearing them first",zh:"当前棋盘有完整碎片组，先尝试自己消除"},
 "No 3-union!":{en:"No 3-piece connected group, try forming one first",zh:"不存在3碎片联合体，先尝试组成3碎片联合体"},
 "Hint!":{en:"Hint!",zh:"提示！"}
};
function T(k){var e=TBL[k];return e?e[LANG]||e.en:k}
function setLang(l){LANG=l;localStorage.setItem("lang",l);updateUI();updateTitle();render()}
function loadSave(){try{var s=localStorage.getItem("dj_save");if(s){var d=JSON.parse(s);if(d.sv!==undefined&&d.gn){return d}}return null}catch(e){return null}}
function saveGame(){try{localStorage.setItem("dj_save",JSON.stringify({sv:SV,gn:GN,sz:SZ,bn:BN}))}catch(e){}}
function getGameConfig(gn){if(gn%10===5)return{sz:4,nq:true};if(gn%10===0)return{sz:6,nq:true};return{sz:gn%2===1?4:6,nq:false}}
function updateTitle(){var t=document.getElementById("title");if(t){var n=GN||0;t.textContent=n>0?(BN?T("Bonus"):"")+T("Game {n}").replace("{n}",n):"Drop Jigsaw"}document.title="Drop Jigsaw"}
var C=document.getElementById("c"),X=C.getContext("2d");
var ST=document.getElementById("status"),TE=document.getElementById("toast");
var RB=document.getElementById("rb"),NB=document.getElementById("nb"),DBB=document.getElementById("db"),SB=document.getElementById("sb"),LB=document.getElementById("lb"),LA=document.getElementById("logArea"),AD=document.getElementById("adrag"),AE=document.getElementById("aelim"),AC2=document.getElementById("acele"),AB=document.getElementById("abgm");
var SE=document.getElementById("score"),ME=document.getElementById("mode");
var LD=document.getElementById("loader"),PB=document.getElementById("progBar"),PTE=document.getElementById("progText"),LDR=document.getElementById("ldReload"),LDQ=document.getElementById("ldQuit");
var SZ=4,BD=[],QQ=[],IM=[],TI=0,CC=0,GO=false,SV=0,DB=false,LOG=[],SND=true,GN=1,BN=false,GS=0;
var DR=null,PS=null,MX=0,MY=0,CN=[],PT=[],SH=[],CA=[],CF=[],DROPS=[],CF_START=0,CI=null,CB=null,IMGC={},PRE=[],PLOAD=false;
var DP=window.devicePixelRatio||1,CELL_W=60,CELL_H=90,CELL_R=2/3;
var CW,CH,BX,BY;

function Piece(i,r,c){this.i=i;this.r=r;this.c=c}
function L(s){var t=new Date().toISOString().slice(11,23);var m=t+" "+s;LOG.push(m);if(LA){LA.value=LOG.join("\n");LA.scrollTop=LA.scrollHeight}console.log(m)}
function log(s){ST.textContent=s;console.log(s)}

function loadImg(url,timeout){timeout=timeout||6000;
 return new Promise(function(ok,fail){
  var img=new Image(),done=false,t=setTimeout(function(){if(!done){done=true;fail("timeout")}},timeout);
  img.onload=function(){if(!done){done=true;clearTimeout(t);ok(img)}};
  img.onerror=function(){if(!done){done=true;clearTimeout(t);fail("404")}};
  img.src=url
 })}


function showLoader(msg){
 LD.style.display="flex";NB.style.display="none";
 if(msg)PTE.textContent=msg||T("Preparing puzzle...");PB.style.width="0%"
}
function hideLoader(){LD.style.display="none";NB.style.display=""}
function setProgress(cur,total){
 var pct=Math.round(cur/total*100);
 PB.style.width=pct+"%"
}
var cancelLoad=false;
LDR.addEventListener("click",function(){cancelLoad=true;hideLoader();init(SZ)});
// quit button removed

function preloadNext(){
 PLOAD=true;
 var ns=SZ===4?6:4,sz2=ns;
 var maxQ=sz2*4,tp2=sz2*sz2+maxQ;
 tp2=Math.floor(tp2/4)*4;var n2=tp2/4;
 log("preloading "+n2+" images for next...");
 pickImgs(n2).then(function(imgs){
  PRE=imgs;PLOAD=false;L("preloaded "+imgs.length+" images")
 }).catch(function(){PLOAD=false})
}

async function pickImgs(n,onProg){
 log("loading "+n+" images...");
 cancelLoad=false;
 // Build two pools: fresh (uncached) first, then cached as fallback
 var fresh=[],cached=[];
 for(var i=1;i<=500;i++){if(IMGC[i]){cached.push(i)}else{fresh.push(i)}}
 // Shuffle each pool independently
 for(var i=fresh.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=fresh[i];fresh[i]=fresh[j];fresh[j]=t}
 for(var i=cached.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=cached[i];cached[i]=cached[j];cached[j]=t}
 // Fresh first, cached fallback
 var nums=fresh.concat(cached);
 var imgs=[],tried=0;
 while(imgs.length<n&&tried<500&&!cancelLoad){
  var batch=[];
  for(var i=0;i<6&&(tried+i)<500&&imgs.length+batch.length<n;i++){
   var ni=nums[tried+i];
   if(IMGC[ni]){imgs.push(IMGC[ni]);if(onProg)onProg(imgs.length,n);continue}
   batch.push({ni:ni})
  }
  if(batch.length===0){tried+=i;continue}
  var results=await Promise.all(batch.map(function(b){
   return loadImg("images/"+String(b.ni).padStart(3,"0")+".jpg",8000).then(function(img){IMGC[b.ni]=img;imgs.push(img);return 1}).catch(function(){return 0})
  }));
  tried+=i;
  if(onProg)onProg(imgs.length,n)
 }
 if(cancelLoad&&imgs.length<n)imgs=imgs.slice(0,n);
 log("loaded "+imgs.length+" images");
 return imgs
}

function resize(){
 CW=Math.min(window.innerWidth,640);
 CH=Math.min(window.innerHeight-160,760)
}

function layout(){
 var maxQ=0;for(var c=0;c<SZ;c++)maxQ=Math.max(maxQ,QQ[c]?QQ[c].length:0);
 var bW=Math.min(window.innerWidth-16,360);
 CELL_W=Math.floor(bW/SZ);if(CELL_W<36)CELL_W=36;
 CELL_H=Math.floor(CELL_W/CELL_R);
 var sH=maxQ>0?CELL_H+(maxQ-1)*CELL_H*0.12+6:0;
 BY=sH+2;
 var bH=SZ*CELL_H;
 CH=BY+bH+4;
 var maxH=Math.min(window.innerHeight-160,760);
 if(CH>maxH){
  var sc=Math.min(1,maxH/CH);
  CELL_W=Math.max(36,Math.floor(CELL_W*sc));
  CELL_H=Math.floor(CELL_W/CELL_R);
  sH=maxQ>0?CELL_H+(maxQ-1)*CELL_H*0.12+6:0;
  BY=sH+2;bH=SZ*CELL_H;CH=BY+bH+4
 }
 CW=SZ*CELL_W+12;
 var maxW=Math.min(window.innerWidth,640);
 if(CW>maxW)CW=maxW;
 C.width=CW*DP;C.height=CH*DP;C.style.width=CW+"px";C.style.height=CH+"px";
 var ga=document.getElementById("gameArea");if(ga){ga.style.width=CW+"px";ga.style.height=CH+"px"}
 var tr=document.querySelector(".title-row");if(tr)tr.style.maxWidth=(SZ*CELL_W)+"px";
 var ct=document.getElementById("ctls");if(ct)ct.style.width=(SZ*CELL_W)+"px";
 var bw=SZ*CELL_W;var bs=Math.floor(bw*0.14);var isz=Math.floor(bs*0.65);var fs=Math.max(8,Math.floor(bw*0.032));
 document.querySelectorAll(".icon-btn").forEach(function(b){b.style.width=bs+"px";b.style.height=bs+"px";b.style.borderRadius=Math.floor(bs*0.25)+"px"});
 document.querySelectorAll(".icon-btn img").forEach(function(i){i.style.width=isz+"px";i.style.height=isz+"px"});
 document.querySelectorAll(".blabel").forEach(function(l){l.style.fontSize=fs+"px"});
 document.querySelectorAll(".hc").forEach(function(b){var bsz=Math.floor(bs*0.35);b.style.width=bsz+"px";b.style.height=bsz+"px";b.style.fontSize=Math.floor(bsz*0.55)+"px";b.style.lineHeight=bsz+"px";b.style.top=Math.floor(-bsz*0.3)+"px";b.style.right=Math.floor(-bs*0.08)+"px"});
 var rb=document.getElementById("restartBtn");if(rb){var rbsz=Math.floor(bw*0.10);rb.style.width=rbsz+"px";rb.style.height=rbsz+"px"};
 if(NB){NB.style.fontSize=Math.floor(bw*0.044)+"px";NB.style.padding=Math.floor(bw*0.04)+"px "+Math.floor(bw*0.08)+"px"};
 X.setTransform(1,0,0,1,0,0);X.scale(DP,DP);
 BX=Math.floor((CW-SZ*CELL_W)/2)
 TE=document.getElementById("toast");if(TE){var bw=SZ*CELL_W;var tw=Math.floor(bw*0.82);TE.style.left=(BX+bw/2)+"px";TE.style.top=(BY+SZ*CELL_H/2)+"px";TE.style.transform="translate(-50%,-50%)";TE.style.maxWidth=tw+"px";TE.style.fontSize=Math.floor(bw*0.045)+"px";TE.style.padding=Math.floor(bw*0.035)+"px "+Math.floor(bw*0.05)+"px";TE.style.borderRadius=Math.floor(bw*0.045)+"px"}
}

// ===== Connections: scan all 2x2 positions =====
function updateConns(){
 CN=[];
 var visited={};
 function con(p1,r1,c1,p2,r2,c2){
  if(!p1||!p2||p1.i!==p2.i)return false;
  if(r1===r2&&c1+1===c2)return p1.r===p2.r&&p1.c+1===p2.c;
  if(r1===r2&&c1-1===c2)return p1.r===p2.r&&p1.c-1===p2.c;
  if(r1+1===r2&&c1===c2)return p1.r+1===p2.r&&p1.c===p2.c;
  if(r1-1===r2&&c1===c2)return p1.r-1===p2.r&&p1.c===p2.c;
  return false
 }
 for(var r=0;r<SZ;r++){
  for(var c=0;c<SZ;c++){
   if(visited[r+","+c]||!BD[r][c])continue;
   var group=[],queue=[{r:r,c:c}],imgI=BD[r][c].i;
   while(queue.length){
    var cur=queue.pop(),key=cur.r+","+cur.c;
    if(visited[key])continue;
    visited[key]=true;group.push(cur);
    var dirs=[[0,1],[0,-1],[1,0],[-1,0]];
    for(var d=0;d<4;d++){
     var nr=cur.r+dirs[d][0],nc=cur.c+dirs[d][1];
     if(nr>=0&&nr<SZ&&nc>=0&&nc<SZ&&!visited[nr+","+nc]&&con(BD[cur.r][cur.c],cur.r,cur.c,BD[nr][nc],nr,nc))
      queue.push({r:nr,c:nc})
    }
   }
   if(group.length>=2){
    var diag=group.length===2&&group[0].r!==group[1].r&&group[0].c!==group[1].c;
    if(!diag){CN.push({p:group,i:imgI,n:group.length});console.log("CN: i="+imgI+" n="+group.length+" "+JSON.stringify(group))}
   }
}}}
// ===== Gravity =====
function gravity(){
 var moved={};
 for(var c=0;c<SZ;c++)for(var r=0;r<SZ;r++)if(BD[r][c])moved[BD[r][c].i+"."+BD[r][c].r+"."+BD[r][c].c]={r:r,c:c};
 for(var c=0;c<SZ;c++){
  var col=[];
  for(var r=SZ-1;r>=0;r--){if(BD[r][c]){col.push(BD[r][c]);BD[r][c]=null}}
  for(var i=0;i<col.length;i++)BD[SZ-1-i][c]=col[i];
  for(var r=SZ-1-col.length;r>=0&&QQ[c].length>0;r--)BD[r][c]=QQ[c].shift()
 }
 for(var c=0;c<SZ;c++)for(var r=0;r<SZ;r++)if(BD[r][c]){
  var k=BD[r][c].i+"."+BD[r][c].r+"."+BD[r][c].c,old=moved[k];
  if(old&&old.r!==r){L("gravity drop "+k+" col="+c+" from row "+old.r+" to "+r);DROPS.push({key:k,col:c,fromR:old.r,toR:r,prog:0,spd:0.08+Math.random()*0.04})}
 }
}

// Card back image loader - called per game
function loadCardBack(){
 var cn=Math.floor(Math.random()*9)+1;
 var img=new Image();
 img.onload=function(){CB=img;render();console.log("card back loaded:",img.naturalWidth,"x",img.naturalHeight)};
 img.onerror=function(){console.error("card back failed, retrying...");setTimeout(loadCardBack,500)};
 img.src="images/utils/card_"+cn+".png"
}
loadCardBack();

async function init(sz,noQueue){
 if(sz)SZ=sz;
 GO=false;CC=0;DR=null;PS=null;GS=SV;CN=[];PT=[];SH=[];CA=[],CF=[],CF_START=0;DROPS=[];LOG=[];if(LA)LA.value="";
 NB.disabled=true;RB.disabled=true;

  // Board: ensure minimum complete images (4x4:2, 6x6:4)

  }

  var completeImgs=[];

  // Ensure we have enough complete sets

  // Place guaranteed complete sets on board
  var boardSlots=[];
  for(var r=0;r<SZ;r++)for(var c=0;c<SZ;c++)boardSlots.push({r:r,c:c});
  // Shuffle board slots
  for(var i=boardSlots.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=boardSlots[i];boardSlots[i]=boardSlots[j];boardSlots[j]=t}

function cellAt(x,y){var c=Math.floor((x-BX)/CELL_W),r=Math.floor((y-BY)/CELL_H);return(c>=0&&c<SZ&&r>=0&&r<SZ)?{r:r,c:c}:null}

function findGroup(r,c){
 for(var g=0;g<CN.length;g++){
  if(CN[g].n===4)continue;
  for(var p=0;p<CN[g].p.length;p++){if(CN[g].p[p].r===r&&CN[g].p[p].c===c)return CN[g]}
 }

}

function startDrag(x,y){

   var pos=grp.p[p];
   items.push({piece:BD[pos.r][pos.c],r:pos.r,c:pos.c,px:BX+pos.c*CELL_W+CELL_W/2,py:BY+pos.r*CELL_H+CELL_H/2});
   BD[pos.r][pos.c]=null
  }
  L("drag GROUP size="+items.length+" anchor at ("+items[0].r+","+items[0].c+")");
  DR={type:"group",items:items,sx:x,sy:y,_moved:false}
 }else{
  DR={type:"single",p:BD[cl.r][cl.c],fr:cl.r,fc:cl.c,_moved:false};
  BD[cl.r][cl.c]=null
 }

}

function endSingle(x,y){

 if(tc.r===DR.fr&&tc.c===DR.fc){BD[DR.fr][DR.fc]=DR.p;return}
 var tp=BD[tc.r][tc.c];
 var tp=BD[tc.r][tc.c];L("swap single ("+DR.fr+","+DR.fc+")<->("+tc.r+","+tc.c+")");
 BD[DR.fr][DR.fc]=tp;

function endGroup(x,y){

 var offs=[];

  targets.push({r:nr,c:nc});

 }

  var tr=targets[i].r,tc2=targets[i].c;

 for(var i=0;i<targets.length;i++)BD[targets[i].r][targets[i].c]=DR.items[i].piece;
 var si=0;

function canRelief(){
 if(SV<50||GO)return "Score low!";
 for(var r=0;r<SZ;r++)for(var c=0;c<SZ;c++)if(!BD[r][c])return "Board has space!";
 // Check if any image has all 4 pieces on board (connected or scattered)
 var cnt={};
 for(var r=0;r<SZ;r++)for(var c=0;c<SZ;c++)if(BD[r][c]){var ii=BD[r][c].i;cnt[ii]=(cnt[ii]||0)+1}
 for(var k in cnt)if(cnt[k]===4)return "Board has groups!";
 updateConns();
 for(var i=0;i<CN.length;i++){
  if(CN[i].n===3){
   var m=findMissing(CN[i]);if(m&&findInQueue(m))return true
  }
 }
 return "No 3-union!"
}

function findMissing(g){
 var pres={};
 for(var p=0;p<g.p.length;p++){var pc=BD[g.p[p].r][g.p[p].c];pres[pc.r+","+pc.c]=true}
 var all=["0,0","0,1","1,0","1,1"];
 for(var i=0;i<4;i++){
  if(!pres[all[i]]){var parts=all[i].split(",");return{i:g.i,r:parseInt(parts[0]),c:parseInt(parts[1])}}
 }
 return null
}

function findInQueue(t){
 for(var c=0;c<SZ;c++)for(var i=0;i<QQ[c].length;i++){var p=QQ[c][i];if(p.i===t.i&&p.r===t.r&&p.c===t.c)return{c:c,i:i}}
 return null
}

function useRelief(){
 if(canRelief()!==true)return;SV-=50;
 updateConns();
 var tg=null;
 for(var i=0;i<CN.length;i++){if(CN[i].n===3){var m=findMissing(CN[i]);if(m&&findInQueue(m)){tg=CN[i];break}}}
 if(!tg)return;
 var ms=findMissing(tg),qp=findInQueue(ms);
 var p0=BD[tg.p[0].r][tg.p[0].c];
 var baseR=tg.p[0].r-p0.r,baseC=tg.p[0].c-p0.c;
 var tr=baseR+ms.r,tc=baseC+ms.c;
 if(tr<0||tr>=SZ||tc<0||tc>=SZ||!BD[tr][tc])return;
 var bp=BD[tr][tc],qpiece=QQ[qp.c].splice(qp.i,1)[0];
 BD[tr][tc]=qpiece;QQ[qp.c].push(bp);
 updateConns();completeGroups();updateUI();render();
 L("RELIEF used img="+tg.i+" missing=("+ms.r+","+ms.c+") from Q col="+qp.c+" swapped at ("+tr+","+tc+")");

}

// ===== Drawing =====
function rr(x,y,w,h,rad){
 X.beginPath();
 X.moveTo(x+rad,y);X.lineTo(x+w-rad,y);
 X.arcTo(x+w,y,x+w,y+rad,rad);
 X.lineTo(x+w,y+h-rad);
 X.arcTo(x+w,y+h,x+w-rad,y+h,rad);
 X.lineTo(x+rad,y+h);
 X.arcTo(x,y+h,x,y+h-rad,rad);
 X.lineTo(x,y+rad);
 X.arcTo(x,y,x+rad,y,rad);
 X.closePath()
}

function drawPiece(r,c,p){
 var img=IM[p.i];if(!img||!img.complete)return;
 var x=BX+c*CELL_W,y=BY+r*CELL_H;
 var pw=img.width/2,ph=img.height/2;
 // Shadow
 X.fillStyle="rgba(0,0,0,0.3)";
 X.beginPath();rr(x+3,y+4,CELL_W-6,CELL_H-6,4);X.fill();
 // Clipped piece
 X.save();
 X.beginPath();rr(x+2,y+2,CELL_W-4,CELL_H-4,4);X.clip();
 X.drawImage(img,p.c*pw,p.r*ph,pw,ph,x,y,CELL_W,CELL_H);
 X.restore();
 // Border
 X.strokeStyle="rgba(255,255,255,0.15)";X.lineWidth=1;
 X.beginPath();rr(x+3,y+3,CELL_W-6,CELL_H-6,3);X.stroke()
  // Debug: piece label
  if(DB){X.shadowColor="rgba(0,0,0,0.8)";X.shadowBlur=3;X.fillStyle="rgba(255,255,255,0.95)";X.font="bold "+Math.floor(CELL_H/4.5)+"px Arial";
  X.textAlign="right";X.textBaseline="bottom";
  var pn=p.r*2+p.c+1;X.fillText(p.i+":"+pn,x+CELL_W-5,y+CELL_H-2);X.shadowBlur=0}
}

function drawConnsO(){

  if(CN[g].n===4)continue;
  var H=(CN[g].i*47+15)%360,a=0.7;
  // Draw group pieces edge-to-edge for perfect alignment
  for(var p=0;p<CN[g].p.length;p++){
   var pos=CN[g].p[p],piece=BD[pos.r][pos.c];if(!piece)continue;
   var img=IM[piece.i];if(!img||!img.complete)continue;
   var pw=img.width/2,ph=img.height/2;
   var x=BX+pos.c*CELL_W,y=BY+pos.r*CELL_H;
   X.save();
   X.beginPath();rr(x,y,CELL_W,CELL_H,4);X.clip();
   X.drawImage(img,piece.c*pw,piece.r*ph,pw,ph,x,y,CELL_W,CELL_H);
   X.restore();
  if(DB){X.shadowColor="rgba(0,0,0,0.8)";X.shadowBlur=3;X.fillStyle="rgba(255,255,255,0.95)";X.font="bold "+Math.floor(CELL_H/4.5)+"px Arial";X.textAlign="right";X.textBaseline="bottom";X.fillText(piece.i+":"+(piece.r*2+piece.c+1),x+CELL_W-5,y+CELL_H-2);X.shadowBlur=0}
  }
  // Group border
  var minC=CN[g].p[0].c,maxC=CN[g].p[0].c,minR=CN[g].p[0].r,maxR=CN[g].p[0].r;
  for(var p=1;p<CN[g].p.length;p++){
   if(CN[g].p[p].c<minC)minC=CN[g].p[p].c;if(CN[g].p[p].c>maxC)maxC=CN[g].p[p].c;
   if(CN[g].p[p].r<minR)minR=CN[g].p[p].r;if(CN[g].p[p].r>maxR)maxR=CN[g].p[p].r
  }
  var isL=CN[g].n===3&&(maxC-minC===1)&&(maxR-minR===1);
  if(isL){
   var has2={};for(var p=0;p<CN[g].p.length;p++)has2[CN[g].p[p].r+","+CN[g].p[p].c]=true;
   var mR=-1,mC=-1;
   for(var tr=minR;tr<=maxR;tr++)for(var tc=minC;tc<=maxC;tc++)if(!has2[tr+","+tc]){mR=tr;mC=tc}
   var pad=2;
   var L=BX+minC*CELL_W,R=BX+(maxC+1)*CELL_W,T=BY+minR*CELL_H,B=BY+(maxR+1)*CELL_H;
   var mx=BX+(minC+1)*CELL_W,my=BY+(minR+1)*CELL_H;
   X.fillStyle="hsla("+H+",80%,65%,"+(a*0.15)+")";
   for(var p=0;p<CN[g].p.length;p++){
    var pos=CN[g].p[p];
    X.beginPath();rr(BX+pos.c*CELL_W+2,BY+pos.r*CELL_H+2,CELL_W-4,CELL_H-4,4);X.fill()
   }
   X.strokeStyle="hsla("+H+",80%,65%,"+a+")";
   X.lineWidth=3.5;
   X.beginPath();var RAD=6;
   if(mR===maxR&&mC===maxC){X.moveTo(L+pad+RAD,T+pad);X.arcTo(R-pad,T+pad,R-pad,T+pad+RAD,RAD);X.arcTo(R-pad,my-pad,mx-pad+RAD,my-pad,RAD);X.arcTo(mx-pad,my-pad,mx-pad,B-pad-RAD,RAD);X.arcTo(mx-pad,B-pad,L+pad+RAD,B-pad,RAD);X.arcTo(L+pad,B-pad,L+pad,T+pad+RAD,RAD);X.arcTo(L+pad,T+pad,L+pad+RAD,T+pad,RAD);X.closePath()}
   else if(mR===maxR&&mC===minC){X.moveTo(L+pad+RAD,T+pad);X.arcTo(R-pad,T+pad,R-pad,T+pad+RAD,RAD);X.arcTo(R-pad,B-pad,mx+pad+RAD,B-pad,RAD);X.arcTo(mx+pad,B-pad,mx+pad,my-pad+RAD,RAD);X.arcTo(mx+pad,my-pad,L+pad+RAD,my-pad,RAD);X.arcTo(L+pad,my-pad,L+pad,T+pad+RAD,RAD);X.arcTo(L+pad,T+pad,L+pad+RAD,T+pad,RAD);X.closePath()}
   else if(mR===minR&&mC===maxC){X.moveTo(L+pad+RAD,T+pad);X.arcTo(mx-pad,T+pad,mx-pad,T+pad+RAD,RAD);X.arcTo(mx-pad,my+pad,R-pad-RAD,my+pad,RAD);X.arcTo(R-pad,my+pad,R-pad,B-pad-RAD,RAD);X.arcTo(R-pad,B-pad,L+pad+RAD,B-pad,RAD);X.arcTo(L+pad,B-pad,L+pad,T+pad+RAD,RAD);X.arcTo(L+pad,T+pad,L+pad+RAD,T+pad,RAD);X.closePath()}
   else{X.moveTo(mx+pad+RAD,T+pad);X.arcTo(R-pad,T+pad,R-pad,T+pad+RAD,RAD);X.arcTo(R-pad,B-pad,L+pad+RAD,B-pad,RAD);X.arcTo(L+pad,B-pad,L+pad,my+pad+RAD,RAD);X.arcTo(L+pad,my+pad,mx+pad-RAD,my+pad,RAD);X.arcTo(mx+pad,my+pad,mx+pad,T+pad+RAD,RAD);X.arcTo(mx+pad,T+pad,mx+pad+RAD,T+pad,RAD);X.closePath()}
   X.stroke()
  }else{
   var gx=BX+minC*CELL_W,gy=BY+minR*CELL_H,gw=(maxC-minC+1)*CELL_W,gh=(maxR-minR+1)*CELL_H;
   X.fillStyle="hsla("+H+",80%,65%,"+(a*0.15)+")";
   X.beginPath();rr(gx,gy,gw,gh,6);X.fill();
   X.strokeStyle="hsla("+H+",80%,65%,"+a+")";
   X.lineWidth=CN[g].n===3?5:3.5;
   X.beginPath();rr(gx+1.5,gy+1.5,gw-3,gh-3,6);X.stroke()
  } }
}


function drawPendingFull(){
 if(!PS)return;
 var grp=PS.group,img=IM[grp.i];if(!img||!img.complete)return;
 var minC=grp.p[0].c,maxC=grp.p[0].c,minR=grp.p[0].r,maxR=grp.p[0].r;
 for(var p=1;p<grp.p.length;p++){if(grp.p[p].c<minC)minC=grp.p[p].c;if(grp.p[p].c>maxC)maxC=grp.p[p].c;if(grp.p[p].r<minR)minR=grp.p[p].r;if(grp.p[p].r>maxR)maxR=grp.p[p].r}
 var gx=BX+minC*CELL_W,gy=BY+minR*CELL_H,gw=(maxC-minC+1)*CELL_W,gh=(maxR-minR+1)*CELL_H;
 // Flash glow effect
 var elapsed=Date.now()-PS.time,flash=Math.min(1,elapsed/200);
 X.fillStyle="rgba(255,255,255,"+(0.25*(1-flash))+")";
 X.beginPath();rr(gx-2,gy-2,gw+4,gh+4,8);X.fill();
 // Draw the complete image
 X.save();
 X.beginPath();rr(gx+1,gy+1,gw-2,gh-2,6);X.clip();
 X.drawImage(img,gx,gy,gw,gh);
 X.restore();
 // Gold border
 X.strokeStyle="rgba(255,215,0,"+(0.6+0.4*Math.sin(elapsed/80))+")";

}

function drawPieceAt(c,y,p){

 var x=BX+c*CELL_W;
 var pw=img.width/2,ph=img.height/2;
 X.save();
 X.beginPath();rr(x+2,y+2,CELL_W-4,CELL_H-4,4);X.clip();
 X.drawImage(img,p.c*pw,p.r*ph,pw,ph,x,y,CELL_W,CELL_H);
 X.restore();
 X.strokeStyle="rgba(255,255,255,0.15)";X.lineWidth=1;

 X.textAlign="right";X.textBaseline="bottom";
 var pn=p.r*2+p.c+1;X.fillText(p.i+":"+pn,x+CELL_W-5,y+CELL_H-2);X.shadowBlur=0}
}
function drawGrid(){
 X.strokeStyle="rgba(255,255,255,0.08)";X.lineWidth=1;
 // Build hidden map from connections
 var hide={};
 for(var g=0;g<CN.length;g++){
  if(CN[g].n===4)continue;
  for(var i=0;i<CN[g].p.length;i++){
   for(var j=i+1;j<CN[g].p.length;j++){
    var p1=CN[g].p[i],p2=CN[g].p[j];
    if(p1.r===p2.r&&Math.abs(p1.c-p2.c)===1)hide["h"+p1.r+","+Math.max(p1.c,p2.c)]=true;
    if(p1.c===p2.c&&Math.abs(p1.r-p2.r)===1)hide["v"+Math.max(p1.r,p2.r)+","+p1.c]=true
   }
  }
 }
 // Horizontal lines
 for(var r=0;r<=SZ;r++){
  if(r===0||r===SZ){
   X.beginPath();X.moveTo(BX,BY+r*CELL_H);X.lineTo(BX+SZ*CELL_W,BY+r*CELL_H);X.stroke()
  }else{
   var s=0;
   for(var c=0;c<=SZ;c++){
    var skip=(c>0&&c<SZ&&hide["h"+(r-1)+","+c]);
    if(skip&&c>s){X.beginPath();X.moveTo(BX+s*CELL_W,BY+r*CELL_H);X.lineTo(BX+c*CELL_W,BY+r*CELL_H);X.stroke();s=c+1}
    else if(!skip&&c===SZ&&SZ>s){X.beginPath();X.moveTo(BX+s*CELL_W,BY+r*CELL_H);X.lineTo(BX+SZ*CELL_W,BY+r*CELL_H);X.stroke()}
   }
  }
 }
 // Vertical lines
 for(var c=0;c<=SZ;c++){
  if(c===0||c===SZ){
   X.beginPath();X.moveTo(BX+c*CELL_W,BY);X.lineTo(BX+c*CELL_W,BY+SZ*CELL_H);X.stroke()
  }else{
   var s=0;
   for(var r=0;r<=SZ;r++){
    var skip=(r>0&&r<SZ&&hide["v"+r+","+(c-1)]);
    if(skip&&r>s){X.beginPath();X.moveTo(BX+c*CELL_W,BY+s*CELL_H);X.lineTo(BX+c*CELL_W,BY+r*CELL_H);X.stroke();s=r+1}
    else if(!skip&&r===SZ&&SZ>s){X.beginPath();X.moveTo(BX+c*CELL_W,BY+s*CELL_H);X.lineTo(BX+c*CELL_W,BY+SZ*CELL_H);X.stroke()}
   }
  }
 }
}

function drawDragged(){
 if(DR.type==="group"){
  try {
   for(var i=0;i<DR.items.length;i++){
    var it=DR.items[i],img=IM[it.piece.i];if(!img||!img.complete)continue;
    var pw=img.width/2,ph=img.height/2;
    var cx=it.px+(MX-DR.sx),cy=it.py+(MY-DR.sy);
    X.globalAlpha=0.7;
    X.save();X.beginPath();rr(cx-CELL_W/2,cy-CELL_H/2,CELL_W,CELL_H,4);X.clip();
    X.drawImage(img,it.piece.c*pw,it.piece.r*ph,pw,ph,cx-CELL_W/2,cy-CELL_H/2,CELL_W,CELL_H);
    X.strokeStyle="rgba(255,255,255,0.6)";X.lineWidth=2;
    X.beginPath();rr(cx-CELL_W/2,cy-CELL_H/2,CELL_W,CELL_H,4);X.stroke();
    X.restore();
   if(DB){X.shadowColor="rgba(0,0,0,0.8)";X.shadowBlur=3;X.fillStyle="rgba(255,255,255,0.95)";X.font="bold "+Math.floor(CELL_H/4.5)+"px Arial";X.textAlign="right";X.textBaseline="bottom";X.fillText(it.piece.i+":"+(it.piece.r*2+it.piece.c+1),cx-CELL_W/2+CELL_W-5,cy-CELL_H/2+CELL_H-2);X.shadowBlur=0}
   }
  } finally {
   X.globalAlpha=1
  }
 }else{
  var img=IM[DR.p.i];if(!img||!img.complete)return;
  var pw=img.width/2,ph=img.height/2;
  var cx=MX,cy=MY,hw=CELL_W/2,hh=CELL_H/2;
  X.fillStyle="rgba(0,0,0,0.5)";
  X.beginPath();rr(cx-hw+4,cy-hh+4,CELL_W-4,CELL_H-4,4);X.fill();
  X.save();X.beginPath();rr(cx-hw,cy-hh,CELL_W,CELL_H,4);X.clip();
  X.drawImage(img,DR.p.c*pw,DR.p.r*ph,pw,ph,cx-hw,cy-hh,CELL_W,CELL_H);
  X.globalAlpha=0.25;X.fillStyle="#fff";X.fill();X.globalAlpha=1;
  X.strokeStyle="rgba(255,255,255,0.7)";X.lineWidth=2;
  X.beginPath();rr(cx-hw,cy-hh,CELL_W,CELL_H,4);X.stroke();
  X.restore()
 }
}

function drawQueues(){
 var maxQ=0;for(var c=0;c<SZ;c++)if(QQ[c].length>maxQ)maxQ=QQ[c].length;
 if(maxQ===0)return;
 var qW=CELL_W-4,step=CELL_H*0.12;
 for(var c=0;c<SZ;c++){
  var cn=QQ[c].length;if(cn===0)continue;
  var qX=BX+c*CELL_W+2;
  var baseY=BY-2-CELL_H;
  for(var vi=0;vi<cn;vi++){
   var dy=baseY-vi*step;
   X.save();X.beginPath();rr(qX+1,dy+1,qW-2,CELL_H-2,4);X.clip();
   if(CB&&CB.complete&&CB.naturalWidth>0){
    X.drawImage(CB,qX+1,dy+1,qW-2,CELL_H-2)
   }else{
    X.fillStyle="#1a1a3e";X.fillRect(qX+2,dy+2,qW-4,CELL_H-4)
   }
   X.restore();
   X.strokeStyle="rgba(255,255,255,0.25)";X.lineWidth=0.8;
   X.beginPath();rr(qX+1,dy+1,qW-2,CELL_H-2,3);X.stroke()
  }
 }
}

function drawShatter(){
 for(var i=0;i<SH.length;i++){
  var s=SH[i];if(!s.img||!s.img.complete)continue;
  var pw=s.img.width/2,ph=s.img.height/2;
  X.save();X.globalAlpha=Math.max(0,s.life*0.8);
  X.translate(s.x,s.y);X.rotate(s.rot);
  var hs=s.size;
  X.beginPath();X.moveTo(-hs,0);X.lineTo(0,-hs*0.7);X.lineTo(hs,0);X.lineTo(0,hs*0.7);X.closePath();X.clip();
  X.drawImage(s.img,s.piece.c*pw,s.piece.r*ph,pw,ph,-hs,-hs,hs*2,hs*2);
  X.restore()
 }
 X.globalAlpha=1
}

 }

function drawRings(){
 for(var i=0;i<CA.length;i++){

 }

function drawConfetti(){
 if(!CF.length)return;
 for(var i=0;i<CF.length;i++){
  var c=CF[i];if(c.delay>0||c.life<=0)continue;
  X.save();X.globalAlpha=Math.min(1,c.life*1.5);
  X.translate(c.x,c.y);X.rotate(c.rot);
  X.fillStyle=c.color;
  if(c.shape==="circle"){X.beginPath();X.arc(0,0,c.w/2,0,Math.PI*2);X.fill()}
  else{X.fillRect(-c.w/2,-c.h/2,c.w,c.h)}
  X.restore()
 }
}
